# ReconConfig. See docs/03_training_validation.md §2, Stage C, and the 2026-08-12 update on
# per-group LR/clipping (a single global clip does not protect `heads` from the late-training
# collapse hazard -- see trainers/recon.py's module docstring).
#
# max_steps was raised 2000 -> 4000 after the 2026-08-12 recon-only re-run against `recon_v3`: with
# these fixes cosine_similarity rose monotonically the whole run (0.128 final, no collapse) and was
# *still climbing* at step 2000 (deltas: +0.0018, +0.0011, +0.0003 over the last 3 checkpoints) --
# but the LR schedule below decays to 0 by max_steps, so that flattening tail is confounded with the
# LR already being near-zero, not necessarily true convergence. Doubling max_steps (same warmup_frac,
# so warmup scales proportionally) gives the cosine schedule more room at a non-negligible LR to tell
# the two apart. See docs/03_training_validation.md's 2026-08-12 "second round" update.
lr: 2.0e-4
lr_backbone_lora: 5.0e-5
lr_heads: 5.0e-5
max_steps: 4000
warmup_frac: 0.03
max_grad_norm: 1.0
max_grad_norm_heads: 0.1
batch_size: 64
val_freq: 100
seed: 0
