# HyperNetConfig -- architecture of the hypernetwork itself. See docs/02_model.md.
# Shared (referenced, not duplicated) by both configs/recon.yaml and configs/sft*.yaml.
backbone_dir: Qwen/Qwen2.5-3B-Instruct

backbone_lora_r: 16
backbone_lora_alpha: 32
backbone_lora_dropout: 0.0
backbone_lora_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

refiner_layers: 2
refiner_heads: 16
refiner_mlp_ratio: 4

decoder_mlp_ratio: 2
head_rank: 128

max_desc_len: 512
attn_implementation: sdpa
gradient_checkpointing: true
dropout: 0.0
