defaults:
  - paths: local
  - algo: grpo
  - model: qwen3_4b_inst
  - checkpoint: base
  - rollout: base
  - eval: base
  - gpu: train_2gpu
  - logging: offline_wandb_tb
  - custom: icrl
  - optimizer: adam_base
  - sglang: base
  - misc: base
  - _self_

runtime:
  python_executable: python3
  train_entrypoint: train.py
  env_vars:
    WANDB_MODE: offline
    NCCL_NVLS_ENABLE: "0"
    PYTHONBUFFERED: "16"

hydra:
  job:
    name: icrl_runner
    chdir: false
  run:
    dir: ${paths.exp_dir}
