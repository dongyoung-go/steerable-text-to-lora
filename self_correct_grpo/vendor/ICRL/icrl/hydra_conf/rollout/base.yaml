cli:
  prompt_data: ${paths.data_dir}/agentgym/train/${custom.env_name}_train.jsonl
  input_key: task_id
  metadata_key: metadata
  rollout_shuffle: true
  num_rollout: 300
  rollout_batch_size: 16
  n_samples_per_prompt: 8
  rollout_sample_filter_path: icrl.sample_filters.mask_rounds
  rollout_max_context_len: 16384
  rollout_max_response_len: 2048
  rollout_temperature: 1
  use_dynamic_global_batch_size: true
  balance_data: true
  sglang_server_concurrency: 32
  # start_rollout_id: 0
  debug_rollout_only: false
