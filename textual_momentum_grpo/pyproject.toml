[project]
name = "tmgrpo"
version = "0.1.0"
description = "Textual Momentum for On-Policy RL -- harness (frontier-model clients, calibration math, data prep)"
readme = "docs/textual_momentum_grpo_README.md"
requires-python = ">=3.12"

# This project's own venv lives at textual_momentum_grpo/.venv, entirely separate from the
# repo root's steerable-text-to-lora env (see docs/build_and_run_guide.md). Deps here are
# deliberately lightweight and CPU-only -- everything that must be runnable/testable without a
# GPU. The actual RL training stack (verl, torch, vllm, ray) is NOT a dependency of this
# package: it runs from the official verl docker image on a provisioned GPU node.
dependencies = [
    "openai>=1.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "datasets>=4.0",
    "math-verify>=0.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tmgrpo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
