algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
data:
  train_files: data/train_openr1.parquet
  val_files: data/eval/math500.parquet
  train_batch_size: 16
  max_prompt_length: 1024
  max_response_length: 2048
actor_rollout_ref:
  model:
    path: models/qwen3-8b
  actor:
    optim:
      lr: 1.0e-06
      betas:
      - 0.9
      - 0.98
      weight_decay: 0.1
      lr_scheduler_type: constant
    ppo_mini_batch_size: 16
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    entropy_coeff: 0.0
    use_kl_loss: true
    kl_loss_coef: 0.0
    kl_loss_type: low_var_kl
  rollout:
    name: vllm
    n: 8
    temperature: 1.0
    response_length: 2048
    calculate_log_probs: true
    gpu_memory_utilization: 0.5
trainer:
  total_epochs: 30
  total_training_steps: 300
  test_freq: 10
  save_freq: 50
  n_gpus_per_node: 1
  nnodes: 1
  logger:
  - console
custom:
  frontier_model: gpt-5-mini
  calibration_w_max: 5.0
  reward_data_source: openr1_math
  conditioning: critique
  internalization: true
  calibration: true
custom_reward_function:
  path: tmgrpo/verl_hooks.py
  name: compute_score
reward:
  custom_reward_function:
    path: tmgrpo/verl_hooks.py
    name: compute_score
