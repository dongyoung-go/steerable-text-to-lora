algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
data:
  train_batch_size: 16
  max_prompt_length: 1024
  max_response_length: 2048
actor_rollout_ref:
  model:
    path: Qwen/Qwen3-8B
  actor:
    optim:
      lr: 1.0e-06
    ppo_mini_batch_size: 16
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    entropy_coeff: 0.0
    use_kl_loss: true
    kl_loss_coef: 0.0
    kl_loss_type: low_var_kl
  rollout:
    name: vllm
    n: 8
    temperature: 1.0
    response_length: 2048
    calculate_log_probs: true
trainer:
  total_epochs: 1
  n_rollout_steps: 300
  test_freq: 10
  save_freq: 50
  n_gpus_per_node: 1
  nnodes: 1
custom:
  frontier_model: gpt-5-mini
  calibration_w_max: 5.0
  reward_data_source: math
  custom_reward_function:
    path: tmgrpo/verl_hooks.py
    name: compute_score
  conditioning: momentum
  internalization: false
  calibration: false
