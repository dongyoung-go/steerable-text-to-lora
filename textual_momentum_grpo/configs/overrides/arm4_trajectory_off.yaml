# Arm (4) Trajectory, OFF/OFF -- README section 4: rollouts conditioned on textual momentum
# M_{t-1} (tmgrpo/trajectory.py), scored under that same conditioned context -- no
# internalization. Shows what momentum-conditioning buys WITHOUT internalizing it (README
# section 4, arm (4) purpose: gains stay locked behind needing M at inference).
custom_reward_function:      # top-level -- copied into reward.custom_reward_function by some verl code paths
  path: tmgrpo/verl_hooks.py
  name: compute_score
reward:                      # main_ppo's actual reward-manager path reads config.reward.custom_reward_function
  custom_reward_function:
    path: tmgrpo/verl_hooks.py
    name: compute_score
custom:
  reward_data_source: openr1_math  # matches data.train_files default (configs/base.yaml) -- set to 'math' if overriding to the MATH pool
  conditioning: momentum       # tmgrpo/trajectory.py TrajectoryState.step() -> M_t, injected via inject_conditioning_context()
  internalization: false
  calibration: false
