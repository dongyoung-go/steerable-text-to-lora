# Arm (1) Floor -- README section 4: "nothing" content, standard GRPO, no internalization/calibration.
# Merged onto configs/base.yaml by scripts/render_arm_config.py -- this file holds only the diff.
custom_reward_function:      # top-level -- copied into reward.custom_reward_function by some verl code paths
  path: tmgrpo/verl_hooks.py
  name: compute_score
reward:                      # main_ppo's actual reward-manager path reads config.reward.custom_reward_function
