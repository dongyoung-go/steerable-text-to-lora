# Arm (2) Instance, OFF/OFF -- README section 4: same-iteration critique, no internalization/
# calibration, pooled original+refined rollouts scored under true generating context (faithful
# Critique-GRPO reproduction -- the sanity gate every other arm's trust depends on, per README
# section 4's success criteria).
custom_reward_function:      # top-level -- copied into reward.custom_reward_function by some verl code paths
  path: tmgrpo/verl_hooks.py
  name: compute_score
reward:                      # main_ppo's actual reward-manager path reads config.reward.custom_reward_function
  custom_reward_function:
    path: tmgrpo/verl_hooks.py
    name: compute_score
custom:
  reward_data_source: openr1_math  # matches data.train_files default (configs/base.yaml) -- set to 'math' if overriding to the MATH pool
  conditioning: critique       # tmgrpo/critique.py generate_critique() + pool_original_and_refined()
  internalization: false
  calibration: false
